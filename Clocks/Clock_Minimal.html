<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Minimal Clock</title>

  <style>
    :root {
      --background: #191919;
      --text: #f1f1f1;
      --muted: #ffffff
    ;
      --border: #dedede;
      --second: #b91c1c;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --background: #ffffff;
        --text: #222222;
        --muted: #777777;
        --border: #2f2f2f;
        --second: #b91c1c;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .clock-widget {
      width: 100%;
      min-height: 100%;
      padding: clamp(22px, 7vh, 42px) 16px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 5vh, 30px);
    }

    .date {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.78rem, 3.5vw, 0.92rem);
      font-weight: 450;
      letter-spacing: 0.025em;
      text-transform: lowercase;
    }

    .clock {
      width: clamp(144px, 68vw, 182px);
      aspect-ratio: 1;
      position: relative;

      border: 3px solid var(--border);
      border-radius: 50%;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;

      transform: translateX(-50%);
      transform-origin: bottom center;
      border-radius: 999px;

      will-change: transform;
    }

    .hour {
      width: 4px;
      height: 27%;
      background: var(--text);
    }

    .minute {
      width: 3px;
      height: 38%;
      background: var(--text);
    }

    .second {
      width: 1px;
      height: 42%;
      background: var(--second);
    }

    .center {
      width: 8px;
      height: 8px;

      position: absolute;
      top: 50%;
      left: 50%;

      border-radius: 50%;
      background: var(--text);

      transform: translate(-50%, -50%);
    }

    .digital-time {
      margin: 0;

      color: var(--text);
      font-size: clamp(1.15rem, 5.5vw, 1.45rem);
      font-weight: 450;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.035em;
    }

    @media (max-height: 360px) {
      .clock-widget {
        gap: 14px;
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .clock {
        width: min(132px, 42vh);
      }
    }
  </style>
</head>

<body>
  <main class="clock-widget" aria-label="Reloj local">
    <p class="date" id="date">jueves · 30 julio</p>

    <div class="clock" aria-hidden="true">
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="center"></div>
    </div>

    <p class="digital-time" id="digital-time">17:27</p>
  </main>

  <script>
    "use strict";

    const hourHand = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");
    const digitalTime = document.getElementById("digital-time");
    const dateText = document.getElementById("date");

    const dateFormatter = new Intl.DateTimeFormat("es-ES", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    function updateClock() {
      const now = new Date();

      const milliseconds = now.getMilliseconds();
      const seconds = now.getSeconds() + milliseconds / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = now.getHours() + minutes / 60;

      hourHand.style.transform =
        `translateX(-50%) rotate(${(hours % 12) * 30}deg)`;

      minuteHand.style.transform =
        `translateX(-50%) rotate(${minutes * 6}deg)`;

      secondHand.style.transform =
        `translateX(-50%) rotate(${seconds * 6}deg)`;

      digitalTime.textContent =
        `${String(now.getHours()).padStart(2, "0")}:` +
        `${String(now.getMinutes()).padStart(2, "0")}`;

      dateText.textContent =
        dateFormatter
          .format(now)
          .replace(" de ", " · ")
          .toLowerCase();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
